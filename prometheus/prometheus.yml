global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "budget-api-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["budget-api-service:5000", "host.docker.internal:5000", "localhost:5000"]

  - job_name: "ai-agent-copilot"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-agent-copilot:5001", "host.docker.internal:5001", "localhost:5001"]

  - job_name: "ml-forecast-engine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ml-forecast-engine:5002", "host.docker.internal:5002", "localhost:5002"]

  - job_name: "personal-budget-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["personal-budget-service:8006", "host.docker.internal:8006", "localhost:8006"]
