<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraminUdyam AI | Rural Advisory & Concessional Credit Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- React 18 and Babel Standalone for Instant Execution -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // API Gateway / Microservice Endpoints (configurable)
        const API_BASE = {
            auth: "http://localhost:8001",
            advisory: "http://localhost:8002",
            marketplace: "http://localhost:8003",
            recommendation: "http://localhost:8004",
            analytics: "http://localhost:8005",
            budget: "http://localhost:8006"
        };

        // Main App Component
        function App() {
            // Role State: 'customer' (Rural Beneficiary), 'budget' (Personal Budget Copilot), or 'seller' (Rural Supplier/Merchant)
            const [role, setRole] = useState('customer');
            const [language, setLanguage] = useState('en'); // 'en' or 'hi'
            const [user, setUser] = useState({
                id: 1,
                name: "Ramesh Patil",
                email: "ramesh.dairy@rural.in",
                role: "customer",
                village: "Shivaji Nagar",
                block: "Baramati",
                district: "Pune",
                margin_capital: 100000,
                business_category: "Dairy"
            });
            const [token, setToken] = useState(localStorage.getItem('token') || 'demo-jwt-token-2026');
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showDbModal, setShowDbModal] = useState(false);

            // Customer Tab Navigation
            const [customerTab, setCustomerTab] = useState('scheme-advisor'); // 'scheme-advisor', 'feasibility', 'marketplace', 'spending-analytics'
            // Seller Tab Navigation
            const [sellerTab, setSellerTab] = useState('dashboard'); // 'dashboard', 'inventory', 'ml-forecast', 'demand-recs'

            return (
                <div>
                    {/* Header Bar */}
                    <header class="glass-header">
                        <div class="header-container">
                            <div class="brand-section">
                                <div class="brand-logo">
                                    <i class="fa-solid fa-seedling"></i>
                                </div>
                                <div>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <span class="brand-name">GraminUdyam AI</span>
                                        <span class="brand-badge">SCA Concessional Credit</span>
                                    </div>
                                    <div style={{ fontSize: '0.72rem', color: '#9ca3af' }}>
                                        Autonomous Advisory & Rural Enterprise Platform
                                    </div>
                                </div>
                            </div>

                            {/* Dual Portal Role Switcher + Personal Budget Switcher */}
                            <div class="role-switcher">
                                <button 
                                    class={`role-btn customer ${role === 'customer' ? 'active' : ''}`}
                                    onClick={() => setRole('customer')}
                                >
                                    <i class="fa-solid fa-user-tie"></i>
                                    {language === 'en' ? 'Entrepreneur' : 'उद्यमी'}
                                </button>
                                <button 
                                    class={`role-btn budget ${role === 'budget' ? 'active' : ''}`}
                                    onClick={() => setRole('budget')}
                                >
                                    <i class="fa-solid fa-wallet"></i>
                                    {language === 'en' ? 'Personal Budget (VaultAI)' : 'व्यक्तिगत बजट'}
                                </button>
                                <button 
                                    class={`role-btn seller ${role === 'seller' ? 'active' : ''}`}
                                    onClick={() => setRole('seller')}
                                >
                                    <i class="fa-solid fa-store"></i>
                                    {language === 'en' ? 'Seller Portal' : 'विक्रेता'}
                                </button>
                            </div>

                            {/* Header Actions */}
                            <div class="header-actions">
                                <button 
                                    class="btn-pill" 
                                    onClick={() => setShowDbModal(true)}
                                    style={{ background: 'rgba(59, 130, 246, 0.18)', color: '#93c5fd', border: '1px solid rgba(59, 130, 246, 0.4)' }}
                                    title="View PostgreSQL Amazon-Grade Relational Database"
                                >
                                    <i class="fa-solid fa-database" style={{ color: '#60a5fa' }}></i>
                                    Database Explorer
                                </button>

                                <button class="btn-pill" onClick={() => setLanguage(l => l === 'en' ? 'hi' : 'en')}>
                                    <i class="fa-solid fa-globe"></i>
                                    {language === 'en' ? 'हिंदी' : 'English'}
                                </button>
                                
                                <button class="btn-pill" onClick={() => setShowAuthModal(true)}>
                                    <i class="fa-solid fa-user-circle"></i>
                                    {user.name} ({role === 'budget' ? 'Budget' : role})
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main class="app-container">
                        {role === 'customer' ? (
                            <CustomerPortal 
                                user={user} 
                                language={language}
                                activeTab={customerTab}
                                setActiveTab={setCustomerTab}
                                onOpenBudget={() => setRole('budget')}
                            />
                        ) : role === 'budget' ? (
                            <PersonalBudgetPortal
                                user={user}
                                token={token}
                                language={language}
                                onBackToEnterprise={() => setRole('customer')}
                            />
                        ) : (
                            <SellerPortal 
                                user={user} 
                                language={language}
                                activeTab={sellerTab}
                                setActiveTab={setSellerTab}
                            />
                        )}
                    </main>

                    {/* Database Explorer Modal (Amazon Schema Viewer) */}
                    {showDbModal && (
                        <DatabaseModal 
                            onClose={() => setShowDbModal(false)}
                            onSelectUser={(u, r) => {
                                setUser(u);
                                setRole(r);
                                setShowDbModal(false);
                            }}
                        />
                    )}

                    {/* Auth Modal */}
                    {showAuthModal && (
                        <AuthModal 
                            onClose={() => setShowAuthModal(false)}
                            onLogin={(u, r) => {
                                setUser(u);
                                setRole(r);
                                setShowAuthModal(false);
                            }}
                        />
                    )}
                </div>
            );

        }

        /* =========================================================================
           CUSTOMER PORTAL COMPONENT
           ========================================================================= */
        function CustomerPortal({ user, language, activeTab, setActiveTab, onOpenBudget }) {
            // Scheme Calculator State
            const [marginCapital, setMarginCapital] = useState(user.margin_capital || 100000);
            const [category, setCategory] = useState(user.business_category || 'Dairy');
            const [village, setVillage] = useState(user.village || 'Shivaji Nagar');
            const [block, setBlock] = useState(user.block || 'Baramati');
            const [district, setDistrict] = useState(user.district || 'Pune');

            const [schemeData, setSchemeData] = useState(null);
            const [feasibilityData, setFeasibilityData] = useState(null);
            const [agentTrace, setAgentTrace] = useState([]);
            const [loadingAdvisor, setLoadingAdvisor] = useState(false);

            // ML Recommendations State
            const [recommendations, setRecommendations] = useState(null);
            // Spending Analytics State
            const [analytics, setAnalytics] = useState(null);
            // Marketplace Products State
            const [products, setProducts] = useState([]);

            // Trigger Advisory Run
            const evaluateAdvisor = async (margin, cat) => {
                setLoadingAdvisor(true);
                try {
                    const res = await fetch(`${API_BASE.advisory}/evaluate-full-proposal`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            applicant_name: user.name,
                            village: village,
                            block: block,
                            district: district,
                            category: cat,
                            margin_capital: margin
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setSchemeData(data.scheme);
                        setFeasibilityData(data.feasibility);
                        setAgentTrace(data.agent_trace);
                    }
                } catch (e) {
                    console.log("Using local calculation fallback:", e);
                    // Local fallback
                    const cost = margin / 0.10;
                    const isMicro = cost <= 140000;
                    const loan = isMicro ? Math.min(cost * 0.90, 125000) : Math.min(cost * 0.90, 4500000);
                    const scheme = {
                        available_margin: margin,
                        feasible_project_cost: cost,
                        eligible_loan_amount: loan,
                        scheme_name: isMicro ? "Micro Finance Scheme" : "Term Loan Scheme",
                        scheme_tier: isMicro ? "Tier 1: Micro Enterprise" : "Tier 2: Medium/Term Enterprise",
                        interest_rate_pa: isMicro ? 6.5 : 8.0,
                        tenure_years: isMicro ? 3 : 7,
                        moratorium_months: isMicro ? 3 : 6,
                        moratorium_quarters: isMicro ? 1 : 2,
                        quarterly_emi: Math.round(loan * 0.045),
                        approx_monthly_obligation: Math.round(loan * 0.045 / 3),
                        capex_allocation: cost * 0.70,
                        working_capital_allocation: cost * 0.30,
                        amortization_schedule: [
                            { quarter: 1, period: "Month 1 - Month 3", status: "Moratorium (Grace Period)", installment: Math.round(loan * 0.015), principal: 0, interest: Math.round(loan * 0.015), remaining_balance: loan, note: "Moratorium active" },
                            { quarter: 2, period: "Month 4 - Month 6", status: "Active Repayment", installment: Math.round(loan * 0.045), principal: Math.round(loan * 0.03), interest: Math.round(loan * 0.015), remaining_balance: Math.round(loan * 0.97), note: "First repayment quarter" },
                            { quarter: 3, period: "Month 7 - Month 9", status: "Active Repayment", installment: Math.round(loan * 0.045), principal: Math.round(loan * 0.031), interest: Math.round(loan * 0.014), remaining_balance: Math.round(loan * 0.94), note: "Quarterly repayment" },
                            { quarter: 4, period: "Month 10 - Month 12", status: "Active Repayment", installment: Math.round(loan * 0.045), principal: Math.round(loan * 0.032), interest: Math.round(loan * 0.013), remaining_balance: Math.round(loan * 0.91), note: "Quarterly repayment" }
                        ]
                    };
                    setSchemeData(scheme);
                } finally {
                    setLoadingAdvisor(false);
                }
            };

            // Trigger ML Recommendations
            const fetchMLRecommendations = async (cat, margin) => {
                try {
                    const res = await fetch(`${API_BASE.recommendation}/recommend/customer`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ category: cat, margin_capital: margin, location: `${block}, ${district}` })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setRecommendations(data);
                    }
                } catch (e) {
                    console.log("ML Rec fallback:", e);
                }
            };

            // Trigger Customer Analytics
            const fetchCustomerAnalytics = async (margin, cat) => {
                try {
                    const res = await fetch(`${API_BASE.analytics}/customer-spending`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ margin_capital: margin, business_category: cat })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setAnalytics(data);
                    }
                } catch (e) {
                    console.log("Analytics fallback:", e);
                }
            };

            // Trigger Marketplace Products
            const fetchProducts = async () => {
                try {
                    const res = await fetch(`${API_BASE.marketplace}/products`);
                    if (res.ok) {
                        const data = await res.json();
                        setProducts(data.products || []);
                    }
                } catch (e) {
                    console.log("Marketplace fallback:", e);
                }
            };

            useEffect(() => {
                evaluateAdvisor(marginCapital, category);
                fetchMLRecommendations(category, marginCapital);
                fetchCustomerAnalytics(marginCapital, category);
                fetchProducts();
            }, []);

            const handleMarginChange = (val) => {
                const num = Number(val);
                setMarginCapital(num);
                evaluateAdvisor(num, category);
                fetchMLRecommendations(category, num);
                fetchCustomerAnalytics(num, category);
            };

            const handleCategoryChange = (cat) => {
                setCategory(cat);
                evaluateAdvisor(marginCapital, cat);
                fetchMLRecommendations(cat, marginCapital);
                fetchCustomerAnalytics(marginCapital, cat);
            };

            return (
                <div>
                    {/* Personal Budget Assistant Launch Banner */}
                    <div class="glass-panel" style={{ padding: '0.85rem 1.25rem', marginBottom: '1.25rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(99, 102, 241, 0.08))', border: '1px solid rgba(139, 92, 246, 0.3)' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.9rem' }}>
                            <div style={{ width: '38px', height: '38px', borderRadius: '10px', background: 'rgba(139, 92, 246, 0.25)', color: '#c4b5fd', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.15rem' }}>
                                <i class="fa-solid fa-wallet"></i>
                            </div>
                            <div>
                                <div style={{ fontWeight: 700, fontSize: '0.88rem', color: '#ffffff' }}>
                                    Personal Budget & Living Expense Assistant (VaultAI)
                                </div>
                                <div style={{ fontSize: '0.74rem', color: '#cbd5e1' }}>
                                    Track household cash flow, check purchase affordabilities, and sync monthly budgets with your enterprise loan profile.
                                </div>
                            </div>
                        </div>
                        <button class="btn-pill" style={{ background: '#8b5cf6', color: '#fff', border: 'none', padding: '0.45rem 1rem' }} onClick={onOpenBudget}>
                            Open Personal Budget <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>

                    {/* Top Metric Cards */}
                    <div class="grid-cols-4">
                        <div class="glass-panel metric-card">
                            <div class="metric-header">
                                <span class="metric-title">{language === 'en' ? 'Available Margin (10%)' : 'उपलब्ध मार्जिन (10%)'}</span>
                                <div class="metric-icon-wrap" style={{ background: 'rgba(59, 130, 246, 0.15)', color: '#60a5fa' }}>
                                    <i class="fa-solid fa-coins"></i>
                                </div>
                            </div>
                            <div class="metric-val">₹{marginCapital.toLocaleString()}</div>
                            <div class="metric-sub">
                                <span class="badge-pill badge-micro">10% Self Equity</span>
                            </div>
                        </div>

                        <div class="glass-panel metric-card">
                            <div class="metric-header">
                                <span class="metric-title">{language === 'en' ? 'Feasible Project Cost' : 'परियोजना लागत (100%)'}</span>
                                <div class="metric-icon-wrap" style={{ background: 'rgba(16, 185, 129, 0.15)', color: '#34d399' }}>
                                    <i class="fa-solid fa-chart-line"></i>
                                </div>
                            </div>
                            <div class="metric-val" style={{ color: '#34d399' }}>
                                ₹{schemeData ? schemeData.feasible_project_cost.toLocaleString() : (marginCapital * 10).toLocaleString()}
                            </div>
                            <div class="metric-sub">
                                <i class="fa-solid fa-arrow-up" style={{ color: '#34d399' }}></i> 10x Margin Leverage
                            </div>
                        </div>

                        <div class="glass-panel metric-card">
                            <div class="metric-header">
                                <span class="metric-title">{language === 'en' ? 'Eligible SCA Loan (90%)' : 'पात्र रियायती ऋण (90%)'}</span>
                                <div class="metric-icon-wrap" style={{ background: 'rgba(139, 92, 246, 0.15)', color: '#a78bfa' }}>
                                    <i class="fa-solid fa-hand-holding-dollar"></i>
                                </div>
                            </div>
                            <div class="metric-val" style={{ color: '#a78bfa' }}>
                                ₹{schemeData ? schemeData.eligible_loan_amount.toLocaleString() : (marginCapital * 9).toLocaleString()}
                            </div>
                            <div class="metric-sub">
                                <span class={`badge-pill ${schemeData && schemeData.scheme_name.includes('Micro') ? 'badge-micro' : 'badge-term'}`}>
                                    {schemeData ? schemeData.scheme_name : 'Auto-Routing'}
                                </span>
                            </div>
                        </div>

                        <div class="glass-panel metric-card">
                            <div class="metric-header">
                                <span class="metric-title">{language === 'en' ? 'Financial Health' : 'वित्तीय स्वास्थ्य स्कोर'}</span>
                                <div class="metric-icon-wrap" style={{ background: 'rgba(245, 158, 11, 0.15)', color: '#fbbf24' }}>
                                    <i class="fa-solid fa-shield-heart"></i>
                                </div>
                            </div>
                            <div class="metric-val" style={{ color: '#fbbf24' }}>
                                {analytics ? `${analytics.financial_health_score}/100` : '85/100'}
                            </div>
                            <div class="metric-sub">
                                <i class="fa-solid fa-circle-check" style={{ color: '#10b981' }}></i>
                                {analytics ? analytics.financial_health_rating : 'DSCR Sustainable'}
                            </div>
                        </div>
                    </div>

                    {/* Navigation Tabs */}
                    <div class="section-tabs">
                        <button 
                            class={`tab-link ${activeTab === 'scheme-advisor' ? 'active' : ''}`}
                            onClick={() => setActiveTab('scheme-advisor')}
                        >
                            <i class="fa-solid fa-calculator"></i>
                            {language === 'en' ? 'Module 2: Smart Scheme Calculator & Router' : 'मॉड्यूल 2: स्मार्ट ऋण योजना कैलकुलेटर'}
                        </button>
                        <button 
                            class={`tab-link ${activeTab === 'feasibility' ? 'active' : ''}`}
                            onClick={() => setActiveTab('feasibility')}
                        >
                            <i class="fa-solid fa-magnifying-glass-chart"></i>
                            {language === 'en' ? 'Module 1: Hyper-Local Feasibility Studio' : 'मॉड्यूल 1: स्थानीय व्यवहार्यता रिपोर्ट'}
                        </button>
                        <button 
                            class={`tab-link ${activeTab === 'marketplace' ? 'active' : ''}`}
                            onClick={() => setActiveTab('marketplace')}
                        >
                            <i class="fa-solid fa-tractor"></i>
                            {language === 'en' ? 'Equipment & Raw Material Marketplace' : 'उपकरण एवं कच्चा माल बाज़ार'}
                        </button>
                        <button 
                            class={`tab-link ${activeTab === 'spending-analytics' ? 'active' : ''}`}
                            onClick={() => setActiveTab('spending-analytics')}
                        >
                            <i class="fa-solid fa-chart-pie"></i>
                            {language === 'en' ? 'Financial Spending & DSCR Analytics' : 'व्यय एवं ऋण चुकाने की क्षमता'}
                        </button>
                    </div>

                    {/* Tab 1: Module 2 Smart Scheme Calculator & Router */}
                    {activeTab === 'scheme-advisor' && (
                        <div>
                            <div class="grid-2-1">
                                <div class="glass-panel" style={{ padding: '1.5rem' }}>
                                    <h3 class="card-title">
                                        <i class="fa-solid fa-sliders" style={{ color: '#3b82f6' }}></i>
                                        {language === 'en' ? 'Interactive Capital Structuring Slider' : 'पूंजी संरचना स्लाइडर'}
                                    </h3>
                                    <p class="card-subtitle">
                                        Adjust your available self-contribution margin money to dynamically simulate eligible project size, SCA loan eligibility, and repayment schedule.
                                    </p>

                                    {/* Margin Slider */}
                                    <div class="capital-slider-wrap">
                                        <div class="slider-val-display">
                                            <span style={{ fontSize: '0.9rem', color: '#9ca3af' }}>Your Available 10% Margin:</span>
                                            <span class="slider-badge">₹{marginCapital.toLocaleString()}</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            class="slider-input" 
                                            min="10000" 
                                            max="500000" 
                                            step="5000"
                                            value={marginCapital}
                                            onChange={(e) => handleMarginChange(e.target.value)}
                                        />
                                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: '#6b7280', marginTop: '0.5rem' }}>
                                            <span>₹10,000 (Min)</span>
                                            <span>₹1,40,000 (Micro Ceiling)</span>
                                            <span>₹5,00,000+ (Term Loan)</span>
                                        </div>
                                    </div>

                                    {/* Category Select Buttons */}
                                    <div style={{ marginBottom: '1.5rem' }}>
                                        <label style={{ fontSize: '0.85rem', fontWeight: 600, color: '#9ca3af', marginBottom: '0.5rem', display: 'block' }}>
                                            Proposed Business Category:
                                        </label>
                                        <div style={{ display: 'flex', gap: '0.6rem', flexWrap: 'wrap' }}>
                                            {['Dairy', 'Textiles', 'Retail', 'Poultry', 'Agro-processing'].map(cat => (
                                                <button 
                                                    key={cat}
                                                    onClick={() => handleCategoryChange(cat)}
                                                    class={`btn-pill ${category === cat ? 'btn-primary' : ''}`}
                                                    style={{ padding: '0.5rem 1rem' }}
                                                >
                                                    {cat === 'Dairy' && <i class="fa-solid fa-cow"></i>}
                                                    {cat === 'Textiles' && <i class="fa-solid fa-shirt"></i>}
                                                    {cat === 'Retail' && <i class="fa-solid fa-basket-shopping"></i>}
                                                    {cat === 'Poultry' && <i class="fa-solid fa-egg"></i>}
                                                    {cat === 'Agro-processing' && <i class="fa-solid fa-wheat-awn"></i>}
                                                    {cat}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Scheme Routing Decision Box */}
                                    {schemeData && (
                                        <div style={{ 
                                            background: schemeData.scheme_name.includes('Micro') ? 'rgba(16, 185, 129, 0.08)' : 'rgba(59, 130, 246, 0.08)', 
                                            border: `1px solid ${schemeData.scheme_name.includes('Micro') ? 'rgba(16, 185, 129, 0.3)' : 'rgba(59, 130, 246, 0.3)'}`,
                                            borderRadius: '12px',
                                            padding: '1.2rem',
                                            marginBottom: '1.5rem'
                                        }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.8rem' }}>
                                                <div>
                                                    <span style={{ fontSize: '0.75rem', textTransform: 'uppercase', color: '#9ca3af', fontWeight: 700 }}>Auto-Selected Scheme</span>
                                                    <h4 style={{ fontSize: '1.2rem', color: '#ffffff', fontWeight: 800 }}>{schemeData.scheme_name}</h4>
                                                </div>
                                                <span class={`badge-pill ${schemeData.scheme_name.includes('Micro') ? 'badge-micro' : 'badge-term'}`}>
                                                    {schemeData.scheme_tier}
                                                </span>
                                            </div>

                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem', fontSize: '0.82rem' }}>
                                                <div>
                                                    <span style={{ color: '#9ca3af' }}>Interest Rate:</span>
                                                    <p style={{ fontWeight: 700, color: '#34d399', fontSize: '1.05rem' }}>{schemeData.interest_rate_pa}% p.a.</p>
                                                </div>
                                                <div>
                                                    <span style={{ color: '#9ca3af' }}>Loan Tenure:</span>
                                                    <p style={{ fontWeight: 700, color: '#60a5fa', fontSize: '1.05rem' }}>{schemeData.tenure_years} Years ({schemeData.tenure_months} Mos)</p>
                                                </div>
                                                <div>
                                                    <span style={{ color: '#9ca3af' }}>Moratorium Period:</span>
                                                    <p style={{ fontWeight: 700, color: '#fbbf24', fontSize: '1.05rem' }}>{schemeData.moratorium_months} Months</p>
                                                </div>

        function PersonalBudgetPortal({ user, token, language, onBackToEnterprise }) {
            const [budgetState, setBudgetState] = useState(null);
            const [loading, setLoading] = useState(true);
            const [generating, setGenerating] = useState(false);

            // ReAct Chat State
            const [messages, setMessages] = useState([
                {
                    sender: "agent",
                    text: `Hello ${user.name}! I am VaultAI, your Personal Budget ReAct Agent Copilot. I analyze your household spending, check purchase affordability, and ensure you remain financially sustainable while running your concessional enterprise loan. How can I help you today?`,
                    tools: ["agent_initialized"]
                }
            ]);
            const [chatInput, setChatInput] = useState("");
            const [sendingChat, setSendingChat] = useState(false);

            // Expense Form State
            const [expItem, setExpItem] = useState("");
            const [expAmount, setExpAmount] = useState("");
            const [expCategory, setExpCategory] = useState("Food & Groceries");

            // Affordability Checker State
            const [affordItem, setAffordItem] = useState("Smartphone");
            const [affordCost, setAffordCost] = useState("12000");
            const [affordCategory, setAffordCategory] = useState("Personal & General");
            const [affordResult, setAffordResult] = useState(null);
            const [checkingAfford, setCheckingAfford] = useState(false);

            // Fetch Budget State from Microservice
            const fetchState = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE.budget}/api/budget/state`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setBudgetState(data);
                    }
                } catch (e) {
                    console.error("Budget service fetch error:", e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchState();
            }, []);

            // Auto-Generate Budget Report (Missing Fields Sync)
            const handleGenerateReport = async () => {
                setGenerating(true);
                try {
                    const res = await fetch(`${API_BASE.budget}/api/budget/generate-report`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            monthly_income: Math.max(38000, (user.margin_capital || 100000) * 0.38)
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setBudgetState(data.state);
                        setMessages(prev => [
                            ...prev,
                            {
                                sender: "agent",
                                text: `⚡ ${data.message}`,
                                tools: ["generate_auto_report", "set_income", "set_category_budget", "set_savings_goal"]
                            }
                        ]);
                    }
                } catch (e) {
                    console.error("Error generating report:", e);
                } finally {
                    setGenerating(false);
                }
            };

            // Send ReAct Chat Query
            const handleSendChat = async (msgToSend = null) => {
                const text = msgToSend || chatInput;
                if (!text.trim()) return;

                const userMsg = { sender: "user", text: text };
                setMessages(prev => [...prev, userMsg]);
                setChatInput("");
                setSendingChat(true);

                try {
                    const res = await fetch(`${API_BASE.budget}/api/budget/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ message: text })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setMessages(prev => [
                            ...prev,
                            {
                                sender: "agent",
                                text: data.response,
                                tools: data.tool_trace || []
                            }
                        ]);
                        // Refresh state after tool execution
                        fetchState();
                    }
                } catch (e) {
                    setMessages(prev => [
                        ...prev,
                        {
                            sender: "agent",
                            text: "I processed your request using autonomous memory fallback.",
                            tools: ["offline_execution"]
                        }
                    ]);
                } finally {
                    setSendingChat(false);
                }
            };

            // Add Expense
            const handleAddExpense = async (e) => {
                e.preventDefault();
                if (!expItem || !expAmount) return;

                try {
                    const res = await fetch(`${API_BASE.budget}/api/budget/expense`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            item: expItem,
                            amount: parseFloat(expAmount),
                            category: expCategory
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setBudgetState(data.state);
                        setExpItem("");
                        setExpAmount("");
                        setMessages(prev => [
                            ...prev,
                            {
                                sender: "agent",
                                text: `✅ Recorded expense: ${expItem} (₹${parseFloat(expAmount).toLocaleString()}) in ${expCategory}.`,
                                tools: ["add_expense"]
                            }
                        ]);
                    }
                } catch (err) {
                    console.error("Expense add error:", err);
                }

            // Check Affordability

                setCheckingAfford(true);

                                        <span class="badge-pill" style={{ background: 'rgba(59, 130, 246, 0.15)', color: '#93c5fd' }}>
                                            <i class="fa-solid fa-file-code"></i> database/customers.json
                                        </span>
                                    </div>

                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                        {customers.map((c, idx) => (
                                            <div key={idx} style={{ background: 'rgba(15, 23, 42, 0.7)', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '12px', padding: '1.25rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                                                <div style={{ flex: 1 }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '0.4rem' }}>
                                                        <h4 style={{ margin: 0, fontSize: '1.05rem', color: '#ffffff', fontWeight: 700 }}>
                                                            {c.first_name} {c.last_name}
                                                        </h4>
                                                        <span class="badge-pill" style={{ background: 'rgba(16, 185, 129, 0.2)', color: '#34d399', fontSize: '0.72rem' }}>
                                                            <i class="fa-solid fa-shield-check"></i> {c.kyc_status}
                                                        </span>
                                                        <span class="badge-pill" style={{ background: 'rgba(245, 158, 11, 0.2)', color: '#fbbf24', fontSize: '0.72rem' }}>
                                                            <i class="fa-solid fa-crown"></i> {c.customer_tier}
                                                        </span>
                                                    </div>

                                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.6rem', fontSize: '0.78rem', color: '#94a3b8', marginTop: '0.6rem' }}>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Customer ID / Email:</span><br />
                                                            <strong style={{ color: '#cbd5e1' }}>CUST-{c.customer_id}</strong> ({c.email})
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Panchayat Location:</span><br />
                                                            <strong style={{ color: '#cbd5e1' }}>{c.village}, {c.block}, {c.district}</strong>
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Available Margin (10%):</span><br />
                                                            <strong style={{ color: '#34d399' }}>₹{c.available_margin_capital?.toLocaleString()}</strong>
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Target Business:</span><br />
                                                            <strong style={{ color: '#cbd5e1' }}>{c.target_business_category}</strong>
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Eligible Concessional Scheme:</span><br />
                                                            <strong style={{ color: '#a78bfa' }}>{c.eligible_concessional_scheme}</strong>
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Eligible Loan Amount (90%):</span><br />
                                                            <strong style={{ color: '#60a5fa' }}>₹{c.eligible_loan_amount?.toLocaleString()}</strong>
                                                        </div>
                                                    </div>
                                                </div>

                                                <button 
                                                    class="btn-pill btn-primary"
                                                    style={{ padding: '0.65rem 1.2rem', whiteSpace: 'nowrap' }}
                                                    onClick={() => selectCustomer(c)}
                                                >
                                                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login as Beneficiary
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : activeDbTab === 'sellers' ? (
                                <div>
                                    <div style={{ marginBottom: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div style={{ fontSize: '0.82rem', color: '#94a3b8' }}>
                                            Table: <code style={{ color: '#10b981' }}>seller_profiles</code> | Joined with <code style={{ color: '#10b981' }}>users</code>
                                        </div>
                                        <span class="badge-pill" style={{ background: 'rgba(16, 185, 129, 0.15)', color: '#6ee7b7' }}>
                                            <i class="fa-solid fa-file-code"></i> database/sellers.json
                                        </span>
                                    </div>

                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                        {sellers.map((s, idx) => (
                                            <div key={idx} style={{ background: 'rgba(15, 23, 42, 0.7)', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '12px', padding: '1.25rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                                                <div style={{ flex: 1 }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '0.4rem' }}>
                                                        <h4 style={{ margin: 0, fontSize: '1.05rem', color: '#ffffff', fontWeight: 700 }}>
                                                            {s.merchant_store_name}
                                                        </h4>
                                                        <span class="badge-pill" style={{ background: 'rgba(59, 130, 246, 0.2)', color: '#60a5fa', fontSize: '0.72rem' }}>
                                                            {s.seller_tier}
                                                        </span>
                                                        <span class="badge-pill" style={{ background: 'rgba(16, 185, 129, 0.2)', color: '#34d399', fontSize: '0.72rem' }}>
                                                            <i class="fa-solid fa-award"></i> {s.merchant_badge}
                                                        </span>
                                                    </div>

                                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.6rem', fontSize: '0.78rem', color: '#94a3b8', marginTop: '0.6rem' }}>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Merchant ID / Legal Entity:</span><br />
                                                            <strong style={{ color: '#cbd5e1' }}>SEL-{s.seller_id}</strong> ({s.legal_company_name})
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>GSTIN & SCA License:</span><br />
                                                            <strong style={{ color: '#cbd5e1' }}>{s.compliance_tax?.gstin || "27AAECK1234F1Z5"}</strong> ({s.compliance_tax?.sca_vendor_license || "SCA-MAH"})
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Fulfillment Logistics:</span><br />
                                                            <strong style={{ color: '#fbbf24' }}>{s.fulfillment_logistics?.fulfillment_channel || "FBA_AND_RURAL_DIRECT"}</strong>
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Customer Rating:</span><br />
                                                            <strong style={{ color: '#f59e0b' }}>⭐ {s.merchant_performance?.seller_rating || 4.88} / 5.0</strong> ({s.merchant_performance?.positive_feedback_percent || 98.4}% Positive)
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Total Orders Fulfilled:</span><br />
                                                            <strong style={{ color: '#34d399' }}>{s.merchant_performance?.total_orders_fulfilled || 1420} Units</strong>
                                                        </div>
                                                        <div>
                                                            <span style={{ color: '#64748b' }}>Warehouse Hub:</span><br />
                                                            <strong style={{ color: '#cbd5e1' }}>{s.fulfillment_logistics?.primary_warehouse?.village || "Baramati MIDC"}</strong>
                                                        </div>
                                                    </div>
                                                </div>

                                                <button 
                                                    class="btn-pill"
                                                    style={{ background: '#10b981', color: '#000', fontWeight: 700, padding: '0.65rem 1.2rem', whiteSpace: 'nowrap', border: 'none' }}
                                                    onClick={() => selectSeller(s)}
                                                >
                                                    <i class="fa-solid fa-store"></i> Login as Seller
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <h4 style={{ margin: '0 0 1rem 0', color: '#ffffff', fontSize: '1rem' }}>
                                        Amazon-Grade Relational Schema Architecture (PostgreSQL)
                                    </h4>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem' }}>
                                        <div style={{ background: 'rgba(15, 23, 42, 0.8)', border: '1px solid rgba(59, 130, 246, 0.3)', borderRadius: '10px', padding: '1rem' }}>
                                            <h5 style={{ margin: '0 0 0.5rem 0', color: '#60a5fa', fontSize: '0.9rem' }}>
                                                <i class="fa-solid fa-table"></i> Table: <code>customer_profiles</code>
                                            </h5>
                                            <ul style={{ margin: 0, paddingLeft: '1.2rem', fontSize: '0.78rem', color: '#cbd5e1', lineHeight: '1.7' }}>
                                                <li><code>customer_id</code> (PK, SERIAL)</li>
                                                <li><code>user_id</code> (FK -&gt; users.id, UNIQUE)</li>
                                                <li><code>kyc_status</code> (VERIFIED_AADHAAR, PENDING)</li>
                                                <li><code>village, block, district, state, postal_code</code></li>
                                                <li><code>available_margin_capital</code> (10% self equity)</li>
                                                <li><code>target_business_category</code> (Dairy, Textiles, etc.)</li>
                                                <li><code>eligible_concessional_scheme</code> (Micro Finance / Term Loan)</li>
                                                <li><code>eligible_loan_amount</code> (90% concessional credit)</li>
                                                <li><code>customer_tier</code> (PRIME_RURAL_BENEFICIARY)</li>
                                            </ul>
                                        </div>

                                        <div style={{ background: 'rgba(15, 23, 42, 0.8)', border: '1px solid rgba(16, 185, 129, 0.3)', borderRadius: '10px', padding: '1rem' }}>
                                            <h5 style={{ margin: '0 0 0.5rem 0', color: '#34d399', fontSize: '0.9rem' }}>
                                                <i class="fa-solid fa-table"></i> Table: <code>seller_profiles</code>
                                            </h5>
                                            <ul style={{ margin: 0, paddingLeft: '1.2rem', fontSize: '0.78rem', color: '#cbd5e1', lineHeight: '1.7' }}>
                                                <li><code>seller_id</code> (PK, SERIAL)</li>
                                                <li><code>user_id</code> (FK -&gt; users.id, UNIQUE)</li>
                                                <li><code>merchant_store_name, legal_company_name</code></li>
                                                <li><code>seller_tier</code> (PLATINUM_RURAL_HUB)</li>
                                                <li><code>merchant_badge</code> (Amazon Fulfilled & SCA Certified)</li>
                                                <li><code>compliance_tax_json</code> (GSTIN, PAN, SCA License)</li>
                                                <li><code>fulfillment_logistics_json</code> (FBA, Hubs, Return Policy)</li>
                                                <li><code>merchant_performance_json</code> (Rating, Orders, SLA)</li>
                                            </ul>
                                        </div>

                                        <div style={{ background: 'rgba(15, 23, 42, 0.8)', border: '1px solid rgba(245, 158, 11, 0.3)', borderRadius: '10px', padding: '1rem' }}>
                                            <h5 style={{ margin: '0 0 0.5rem 0', color: '#fbbf24', fontSize: '0.9rem' }}>
                                                <i class="fa-solid fa-table"></i> Table: <code>products (Amazon ASIN Catalog)</code>
                                            </h5>
                                            <ul style={{ margin: 0, paddingLeft: '1.2rem', fontSize: '0.78rem', color: '#cbd5e1', lineHeight: '1.7' }}>
                                                <li><code>id</code> (PK, SERIAL)</li>
                                                <li><code>asin</code> (Amazon Standard Identification Number, UNIQUE)</li>
                                                <li><code>seller_id</code> (FK -&gt; seller_profiles.seller_id)</li>
                                                <li><code>title, description, category</code></li>
                                                <li><code>price, cost_price, inventory_count</code></li>
                                                <li><code>is_eligible_sca_subsidy</code> (BOOLEAN)</li>
                                            </ul>
                                        </div>

                                        <div style={{ background: 'rgba(15, 23, 42, 0.8)', border: '1px solid rgba(168, 85, 247, 0.3)', borderRadius: '10px', padding: '1rem' }}>
                                            <h5 style={{ margin: '0 0 0.5rem 0', color: '#c084fc', fontSize: '0.9rem' }}>
                                                <i class="fa-solid fa-table"></i> Table: <code>orders (SCA Escrow & Fulfillment)</code>
                                            </h5>
                                            <ul style={{ margin: 0, paddingLeft: '1.2rem', fontSize: '0.78rem', color: '#cbd5e1', lineHeight: '1.7' }}>
                                                <li><code>id</code> (PK, SERIAL)</li>
                                                <li><code>customer_id</code> (FK -&gt; customer_profiles.customer_id)</li>
                                                <li><code>product_id</code> (FK -&gt; products.id)</li>
                                                <li><code>status</code> (CONFIRMED, SCA_ESCROW_DISBURSED, DELIVERED)</li>
                                                <li><code>margin_money_paid, sca_subsidy_amount</code></li>
                                                <li><code>created_at</code> (TIMESTAMP)</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div style={{ padding: '0.9rem 1.5rem', background: 'rgba(15, 23, 42, 0.8)', borderTop: '1px solid rgba(255, 255, 255, 0.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span style={{ fontSize: '0.78rem', color: '#64748b' }}>
                                Files: <code style={{ color: '#93c5fd' }}>database/customers.json</code> &bull; <code style={{ color: '#93c5fd' }}>database/sellers.json</code> &bull; <code style={{ color: '#93c5fd' }}>database/schema.sql</code>
                            </span>
                            <button class="btn-pill" onClick={onClose} style={{ padding: '0.45rem 1rem' }}>
                                Close Explorer
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        /* =========================================================================
           AUTH MODAL COMPONENT (JWT)
           ========================================================================= */
        function AuthModal({ onClose, onLogin }) {

            const [isRegister, setIsRegister] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [selectedRole, setSelectedRole] = useState('customer');

            const handleDemoLogin = (r) => {
                if (r === 'customer') {
                    onLogin({
                        id: 1,
                        name: "Ramesh Patil",
                        email: "ramesh.dairy@rural.in",
                        role: "customer",
                        village: "Shivaji Nagar",
                        block: "Baramati",
                        district: "Pune",
                        margin_capital: 100000,
                        business_category: "Dairy"
                    }, 'customer');
                } else {
                    onLogin({
                        id: 2,
                        name: "Kisan Agro Machinery & Supplies",
                        email: "kisan.agritech@rural.in",
                        role: "seller",
                        village: "Midc Industrial Area",
                        block: "Baramati",
                        district: "Pune",
                        margin_capital: 500000,
                        business_category: "Machinery & Supplies"
                    }, 'seller');
                }
            };

            return (
                <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
                    <div class="glass-panel" style={{ width: '420px', padding: '1.8rem', background: '#0f172a' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.2rem' }}>
                            <h3 class="card-title">
                                <i class="fa-solid fa-lock" style={{ color: '#3b82f6' }}></i>
                                {isRegister ? 'Register Account' : 'JWT Authentication'}
                            </h3>
                            <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#9ca3af', fontSize: '1.2rem', cursor: 'pointer' }}>×</button>
                        </div>

                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.8rem', marginBottom: '1.2rem' }}>
                            {isRegister && (
                                <input 
                                    type="text" 
                                    placeholder="Full Name / Enterprise Name" 
                                    value={name} 
                                    onChange={e => setName(e.target.value)}
                                    style={{ width: '100%', padding: '0.65rem', background: '#1e293b', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: '#fff' }}
                                />
                            )}
                            <input 
                                type="email" 
                                placeholder="Email address" 
                                value={email} 
                                onChange={e => setEmail(e.target.value)}
                                style={{ width: '100%', padding: '0.65rem', background: '#1e293b', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: '#fff' }}
                            />
                            <input 
                                type="password" 
                                placeholder="Password" 
                                value={password} 
                                onChange={e => setPassword(e.target.value)}
                                style={{ width: '100%', padding: '0.65rem', background: '#1e293b', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: '#fff' }}
                            />

                            <div style={{ display: 'flex', gap: '0.5rem', marginTop: '0.4rem' }}>
                                <button 
                                    type="button" 
                                    class={`role-btn customer ${selectedRole === 'customer' ? 'active' : ''}`}
                                    style={{ flex: 1, justifyContent: 'center' }}
                                    onClick={() => setSelectedRole('customer')}
                                >
                                    Customer
                                </button>
                                <button 
                                    type="button" 
                                    class={`role-btn seller ${selectedRole === 'seller' ? 'active' : ''}`}
                                    style={{ flex: 1, justifyContent: 'center' }}
                                    onClick={() => setSelectedRole('seller')}
                                >
                                    Seller
                                </button>
                            </div>
                        </div>

                        <button 
                            class="btn-pill btn-primary" 
                            style={{ width: '100%', justifyContent: 'center', padding: '0.7rem' }}
                            onClick={() => handleDemoLogin(selectedRole)}
                        >
                            {isRegister ? 'Create Account' : 'Sign In with JWT'}
                        </button>

                        {/* Quick Demo Switcher */}
                        <div style={{ borderTop: '1px solid rgba(255,255,255,0.1)', marginTop: '1.2rem', paddingTop: '1rem' }}>
                            <span style={{ fontSize: '0.72rem', color: '#9ca3af', textTransform: 'uppercase', fontWeight: 700, display: 'block', marginBottom: '0.6rem' }}>
                                Instant 1-Click Demo Profiles:
                            </span>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                <button class="btn-pill" style={{ width: '100%', justifyContent: 'flex-start' }} onClick={() => handleDemoLogin('customer')}>
                                    <i class="fa-solid fa-user-tie" style={{ color: '#3b82f6' }}></i>
                                    Login as Beneficiary: <strong>Ramesh Patil (Dairy)</strong>
                                </button>
                                <button class="btn-pill" style={{ width: '100%', justifyContent: 'flex-start' }} onClick={() => handleDemoLogin('seller')}>
                                    <i class="fa-solid fa-store" style={{ color: '#10b981' }}></i>
                                    Login as Seller: <strong>Kisan Agro Supplies</strong>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Mount React Root
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
