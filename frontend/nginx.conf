server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy Routing
    location /api/auth/ {
        proxy_pass http://auth-service:8001/;
    }

    location /api/advisory/ {
        proxy_pass http://advisory-service:8002/;
    }

    location /api/marketplace/ {
        proxy_pass http://marketplace-service:8003/;
    }

    location /api/recommendation/ {
        proxy_pass http://recommendation-service:8004/;
    }

    location /api/analytics/ {
        proxy_pass http://analytics-service:8005/;
    }

    location /api/budget/ {
        proxy_pass http://personal-budget-service:8006/;
    }
}
