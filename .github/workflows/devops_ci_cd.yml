name: DevSecOps CI/CD Pipeline & Docker Hub Auto-Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-test-security:
    name: DevSecOps Security Gates & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest scikit-learn numpy prometheus-client fastapi starlette requests bandit

      - name: Stage 2: Flake8 Linting
        run: |
          flake8 services tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Stage 3: Pytest Suite (Determinism & ML Accuracy)
        run: |
          pytest tests/test_devsecops.py -v

      - name: Stage 4: Bandit SAST Security Scan
        run: |
          bandit -r services/budget_api_service services/ai_agent_copilot services/ml_forecast_engine -c bandit.yaml -f json -o bandit-report.json || true

      - name: Upload Bandit SAST Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  build-scan-push:
    name: Docker Build, Trivy Scan & Docker Hub Push
    needs: lint-test-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Docker Hub (if secrets configured)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build budget-api-service Image
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME || 'pba' }}/budget-api-service"
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest services/budget_api_service

      - name: Stage 5: Trivy Container CVE Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME || 'pba' }}/budget-api-service:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Images to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/budget-api-service"
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
