events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream budget_api {
        server budget-api-service:5000;
    }

    upstream ai_copilot {
        server ai-agent-copilot:5001;
    }

    upstream ml_engine {
        server ml-forecast-engine:5002;
    }

    upstream grafana_dashboard {
        server grafana:3000;
    }

    upstream prometheus_ui {
        server prometheus:9090;
    }

    upstream jenkins_ui {
        server jenkins:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Static / Root proxy to budget-api or frontend
        location / {
            proxy_pass http://budget_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Routes
        location /api/ {
            proxy_pass http://budget_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # AI Agent routes
        location /api/agent/ {
            proxy_pass http://ai_copilot/api/agent/;
            proxy_set_header Host $host;
        }

        # ML Forecast routes
        location /api/ml/ {
            proxy_pass http://ml_engine/api/ml/;
            proxy_set_header Host $host;
        }

        # Prometheus proxy
        location /prometheus/ {
            proxy_pass http://prometheus_ui/;
            proxy_set_header Host $host;
        }

        # Grafana proxy
        location /grafana/ {
            proxy_pass http://grafana_dashboard/;
            proxy_set_header Host $host;
        }
    }
}
