apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rural-platform-ingress
  namespace: rural-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: rural-enterprise.local
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /api/advisory
            pathType: Prefix
            backend:
              service:
                name: advisory-service
                port:
                  number: 8002
          - path: /api/marketplace
            pathType: Prefix
            backend:
              service:
                name: marketplace-service
                port:
                  number: 8003
          - path: /api/recommendation
            pathType: Prefix
            backend:
              service:
                name: recommendation-service
                port:
                  number: 8004
          - path: /api/analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8005
          - path: /api/budget
            pathType: Prefix
            backend:
              service:
                name: personal-budget-service
                port:
                  number: 8006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
