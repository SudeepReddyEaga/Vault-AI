apiVersion: v1
kind: Namespace
metadata:
  name: rural-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rural-platform-config
  namespace: rural-platform
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  POSTGRES_DB: "rural_platform_db"
  DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres-service:5432/rural_platform_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: rural-platform-secrets
  namespace: rural-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgrespassword2026"
  JWT_SECRET: "super-secret-rural-enterprise-jwt-key-2026"
