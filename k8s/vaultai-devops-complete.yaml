# =========================================================================
# VAULT AI - COMPLETE KUBERNETES MANIFESTS (Table 3.1.1 Port Allocation)
# =========================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: vault-ai
---
# 1. ConfigMaps & Secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultai-config
  namespace: vault-ai
data:
  AI_AGENT_URL: "http://ai-agent-copilot:5001"
  ML_ENGINE_URL: "http://ml-forecast-engine:5002"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/rural_platform_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: vaultai-secrets
  namespace: vault-ai
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword2026"
  VAULT_DEV_ROOT_TOKEN_ID: "root-dev-token-2026"
---
# 2. PostgreSQL Service & Deployment (Port 5432)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vault-ai
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vault-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: vaultai-secrets
---
# 3. Redis Cache Service & Deployment (Port 6379)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vault-ai
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vault-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
# 4. HashiCorp Vault (Port 8200)
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault-ai
spec:
  ports:
    - port: 8200
      targetPort: 8200
  selector:
    app: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:latest
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "root-dev-token-2026"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
---
# 5. ai-agent-copilot (Port 5001)
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-copilot
  namespace: vault-ai
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: ai-agent-copilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-copilot
  namespace: vault-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-copilot
  template:
    metadata:
      labels:
        app: ai-agent-copilot
    spec:
      containers:
        - name: ai-agent-copilot
          image: pba/ai-agent-copilot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# 6. ml-forecast-engine (Port 5002)
apiVersion: v1
kind: Service
metadata:
  name: ml-forecast-engine
  namespace: vault-ai
spec:
  ports:
    - port: 5002
      targetPort: 5002
  selector:
    app: ml-forecast-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-forecast-engine
  namespace: vault-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-forecast-engine
  template:
    metadata:
      labels:
        app: ml-forecast-engine
    spec:
      containers:
        - name: ml-forecast-engine
          image: pba/ml-forecast-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# 7. budget-api-service (Port 5000)
apiVersion: v1
kind: Service
metadata:
  name: budget-api-service
  namespace: vault-ai
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: budget-api-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-api-service
  namespace: vault-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: budget-api-service
  template:
    metadata:
      labels:
        app: budget-api-service
    spec:
      containers:
        - name: budget-api-service
          image: pba/budget-api-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: vaultai-config
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
---
# 8. Prometheus Server (Port 9090)
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: vault-ai
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: vault-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
---
# 9. Grafana Dashboard (Port 3000)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: vault-ai
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: vault-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
---
# 10. Horizontal Pod Autoscaler (HPA: 2 to 10 replicas)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: budget-api-hpa
  namespace: vault-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: budget-api-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
# 11. Ingress (Port 80 / 443)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultai-ingress
  namespace: vault-ai
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: budget-api-service
                port:
                  number: 5000
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
